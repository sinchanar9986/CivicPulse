{% extends "base.html" %}
{% block title %}Admin Login – CivicPulse{% endblock %}

{% block content %}
<div class="container">
  <div class="login-card">
    <div class="card">
      <div class="card-header text-center py-3">
        <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Admin Login</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg"
                   placeholder="Enter admin password" required autofocus>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </div>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      <a href="{{ url_for('citizen.index') }}"><i class="bi bi-arrow-left me-1"></i>Back to citizen portal</a>
    </p>
  </div>
</div>
{% endblock %}
